spring:
  application:
    name: enjoytrip
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
  datasource:
    url: jdbc:mysql://${DB_HOST}:3306/enjoytrip
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}



# swagger
springdoc:
  api-docs:
    path: /api
  swagger-ui:
    url: /api
    path: /api